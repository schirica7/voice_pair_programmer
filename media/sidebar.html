<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource}; script-src 'nonce-${nonce}';">
	<link rel="stylesheet" href="${styleUri}">
	<title>Voice Pair Programmer</title>
</head>
<body>
	<div class="actions">
		<button id="toggle" type="button"></button>
		<button id="ask" class="secondary" type="button">Share</button>
		<button id="recordMic" class="secondary" type="button">Record</button>
	</div>

	<div class="status">
		<span id="statusDot" class="dot"></span>
		<span id="statusText"></span>
		<span class="muted">·</span>
		<span id="backendStatus"></span>
	</div>

	<div class="context">
		<div id="activeFile" class="file"></div>
		<div id="contextMeta" class="muted"></div>
	</div>

	<div class="metrics">
		<span id="diagnosticCount" class="metric"></span>
		<span id="openTabCount" class="metric"></span>
		<span id="availableFileCount" class="metric"></span>
	</div>

	<section id="transcriptSection" class="panel" hidden>
		<div class="panelHeader">
			<span>You said</span>
			<span id="transcriptStatus" class="muted"></span>
		</div>
		<pre id="lastTranscript"></pre>
	</section>

	<section id="answerSection" class="answer" hidden>
		<div class="panelHeader">
			<span>Latest answer</span>
			<span id="answerModel" class="muted"></span>
		</div>
		<pre id="lastAnswer"></pre>
	</section>

	<script id="initialState" type="application/json">${initialState}</script>
	<script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
