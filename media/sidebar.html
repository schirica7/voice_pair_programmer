<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource}; script-src 'nonce-${nonce}';">
	<link rel="stylesheet" href="${styleUri}">
	<title>Voice Pair Programmer</title>
</head>
<body>
	<div class="actions">
		<button id="toggle" type="button"></button>
		<button id="capture" class="secondary" type="button">Capture</button>
	</div>

	<div class="status">
		<span id="statusDot" class="dot"></span>
		<span id="statusText"></span>
		<span class="muted">·</span>
		<span id="backendStatus"></span>
	</div>

	<div class="context">
		<div id="activeFile" class="file"></div>
		<div id="contextMeta" class="muted"></div>
	</div>

	<div class="metrics">
		<span id="diagnosticCount" class="metric"></span>
		<span id="openTabCount" class="metric"></span>
		<span id="availableFileCount" class="metric"></span>
	</div>

		window.initialVoicePairState = ${initialState};
	</script>
	<script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
