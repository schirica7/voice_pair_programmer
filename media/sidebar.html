<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource}; script-src 'nonce-${nonce}';">
	<link rel="stylesheet" href="${styleUri}">
	<title>Voice Pair Programmer</title>
</head>
<body>
	<div class="actions">
		<button id="toggle" type="button"></button>
		<button id="ask" class="secondary" type="button">Share</button>
	</div>

	<div class="status">
		<span id="statusDot" class="dot"></span>
		<span id="statusText"></span>
		<span class="muted">·</span>
		<span id="backendStatus"></span>
	</div>

	<section id="speechSection" class="speech" hidden>
		<div class="panelHeader">
			<span id="speechSpeaker"></span>
			<span id="speechMeta" class="muted"></span>
		</div>
		<pre id="speechText"></pre>
	</section>

	<script id="initialState" type="application/json">${initialState}</script>
	<script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
